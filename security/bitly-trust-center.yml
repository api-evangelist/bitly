corrections:
- date: '2026-08-13'
  was: https://bitly.com/pages/landing/branded-short-domains-powered-by-bitly?bsd=trust.bitly.com
  problem: >-
    Prior rounds recorded trust.bitly.com as Bitly's trust center. It is not one. trust.bitly.com
    is a registered Bitly branded short domain with no link behind it, so it 302s to the generic
    "Custom Domain by Bitly" marketing landing page. That page happens to contain the string
    "SOC 2" in Bitly's own marketing copy, which is what tripped the keyword probe — a soft-404
    scored as evidence. The real trust center is the SafeBase portal at security.bitly.com,
    which the automated probe never reaches because it is on a different subdomain.
  resolution: >-
    Repointed to https://security.bitly.com/ and upgraded the certification list from
    "SOC 2, GDPR" to the published SOC 2 Type 2, GDPR and CCPA.
