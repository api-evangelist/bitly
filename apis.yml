apis:
  - aid: bitly:bitly-api
    name: Bitly API v4
    description: >-
      REST API for creating and managing Bitlinks, custom domains, groups,
      campaigns, QR codes, and click analytics. Authentication uses Bearer
      tokens issued from Bitly account settings or via OAuth 2.0.
    humanURL: https://dev.bitly.com/api-reference
    baseURL: https://api-ssl.bitly.com/v4
