aid: bitly
name: Bitly
description: Bitly is a link management platform for creating, branding, routing and measuring short links,
  QR Codes and link-in-bio pages at scale. The Bitly v4 REST API is a 94-operation, bearer-authenticated
  JSON API at https://api-ssl.bitly.com/v4 covering Bitlink creation and expansion, custom back-halves,
  branded short domains, groups (workspaces) and organizations, campaigns and channels, dynamic and static
  QR Codes, bulk shortening, engagement webhooks, and a deep click/scan analytics surface sliced by country,
  city, device, OS, browser and referrer. Bitly publishes its own OpenAPI 3.0 definition and operates
  an official remote Model Context Protocol server, making it directly callable by AI agents.
type: Index
