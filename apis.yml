aid: bitly
name: Bitly
description: >-
  Bitly is a URL shortening and link management platform that enables
  developers and marketers to create branded short links, generate QR codes,
  track engagement analytics, and manage link campaigns at scale. The Bitly v4
  REST API provides programmatic access to link creation, custom domains,
  groups, campaigns, click metrics, and QR codes using Bearer token
  authentication.
type: Index
image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
tags:
