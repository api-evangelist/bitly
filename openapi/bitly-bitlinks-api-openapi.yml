            $ref: '#/components/schemas/LinkClicks'
        units:
          type: integer
        unit:
          type: string
          enum:
          - minute
          - hour
          - day
          - week
          - month
        unit_reference:
          type: string
    ClicksSummary:
      type: object
      properties:
        total_clicks:
          type: integer
        units:
          type: integer
        unit:
          type: string
          enum:
          - minute
          - hour
          - day
          - week
          - month
        unit_reference:
          type: string
    Conflict:
      description: CONFLICT
      allOf:
      - $ref: '#/components/schemas/Error'
    Deeplink:
      type: object
      properties:
        app_id:
          type: string
        app_uri_path:
          type: string
        install_url:
          type: string
        install_type:
          $ref: '#/components/schemas/InstallPreference'
    DeeplinkRule:
      type: object
      properties:
        guid:
          type: string
        bitlink:
          type: string
        app_uri_path:
          type: string
        install_url:
          type: string
        app_guid:
          type: string
        os:
          $ref: '#/components/schemas/MobileOS'
        install_type:
          $ref: '#/components/schemas/InstallPreference'
        created:
          type: string
          description: ISO timestamp
        modified:
          type: string
          description: ISO timestamp
        brand_guid:
          type: string
    DeletedLink:
      type: object
      properties:
        id:
          type: string
    DeviceMetric:
      type: object
      properties:
        clicks:
          type: integer
        device_type:
          type: string
    DeviceMetrics:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseMetrics'
      - properties:
          metrics:
            type: array
            items:
              $ref: '#/components/schemas/DeviceMetric'
    DynamicRoutingDeviceEnum:
      description: Device type values for use in dynamic routing rules (device_match / device_exclude)
      type: string
      enum:
      - mobile
      - tablet
      - desktop
    DynamicRoutingPlatformEnum:
      description: Platform (OS) values for use in dynamic routing rules (os_match / os_exclude)
      type: string
      enum:
      - ios
      - android
    DynamicRoutingRule:
      type: object
      description: A dynamic routing rule that redirects traffic to a different destination based on user
        attributes.
      properties:
        long_url:
          type: string
          description: The destination URL for requests matching this rule.
        country_match:
          type: array
          items:
            type: string
          description: ISO 3166-1 alpha-2 country codes that trigger this rule (e.g., ["US", "CA"]).
        country_exclude:
          type: array
          items:
            type: string
          description: ISO 3166-1 alpha-2 country codes that must NOT match for this rule to apply.
        region_match:
          type: array
          items:
            type: string
          description: ISO 3166-2 region codes that trigger this rule (e.g., ["US-CA", "CA-ON"]).
        region_exclude:
          type: array
          items:
            type: string
          description: ISO 3166-2 region codes that must NOT match for this rule to apply (e.g., ["US-CA",
            "CA-ON"]).
        device_match:
          type: array
          items:
            $ref: '#/components/schemas/DynamicRoutingDeviceEnum'
          description: Device types that trigger this rule (e.g., ["mobile", "tablet"]).
        device_exclude:
          type: array
          items:
            $ref: '#/components/schemas/DynamicRoutingDeviceEnum'
          description: Device types that must NOT match for this rule to apply.
        os_match:
          type: array
          items:
            $ref: '#/components/schemas/DynamicRoutingPlatformEnum'
          description: Operating systems that trigger this rule (e.g., ["ios", "android"]).
        os_exclude:
          type: array
          items:
            $ref: '#/components/schemas/DynamicRoutingPlatformEnum'
          description: Operating systems that must NOT match for this rule to apply.
    Engagement:
      type: object
      properties:
        lib_button_clicks:
          type: integer
        clicks:
          type: integer
        scans:
          type: integer
    EngagementSubtotal:
      description: 'Engagement-count subtotal for a single bitlink or decoupled QR code. The `id` references
        either a bitlink (`<domain>/<hash>`) or a QR code guid, and `engagements` is the combined count
        of bitlink clicks or QR code scans for that entity.

        '
      type: object
      properties:
        engagements:
          type: integer
        id:
          type: string
    Engagements:
      type: object
      properties:
        engagement_count:
          type: integer
        engagements:
          $ref: '#/components/schemas/Engagement'
        date:
          type: string
    Error:
      type: object
      properties:
        message:
          type: string
        description:
          type: string
        resource:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    ExpandBitlink:
      type: object
      properties:
        bitlink_id:
          type: string
      example:
        bitlink_id: bit.ly/12a4b6c
    ExpandedBitlink:
      type: object
      properties:
        link:
          type: string
        id:
          type: string
        long_url:
          type: string
        long_urls:
          type: array
          description: 'The list of destination URLs for this bitlink, including the default long URL
            and any dynamically routed destination URLs.

            '
          items:
            type: string
        created_at:
          type: string
    ExpectationFailed:
      description: EXPECTATION_FAILED
      allOf:
      - $ref: '#/components/schemas/Error'
      example:
        code: DNS_CONFIGURATION_ERROR
    FieldError:
      type: object
      properties:
        field:
          type: string
        error_code:
          type: string
        message:
          type: string
    Forbidden:
      description: FORBIDDEN
      allOf:
      - $ref: '#/components/schemas/Error'
    FullShorten:
      type: object
      description: Either long_url (for new bitlinks) or bitlink_id (for adding keywords to existing bitlinks)
        must be provided, but not both.
      properties:
        long_url:
          type: string
          description: URL to be shortened. Required when creating new bitlinks. Cannot be used with bitlink_id.
        domain:
          type: string
          default: bit.ly
        group_guid:
          type: string
          description: Always include a specific group and custom domain in your shorten calls.
        title:
          type: string
        tags:
          type: array
          items:
            type: string
        deeplinks:
          type: array
          items:
            $ref: '#/components/schemas/Deeplink'
        force_new_link:
          type: boolean
        keyword:
          type: string
          description: Custom keyword for creating keyword overrides. If provided, creates an override
            at domain/keyword
        bitlink_id:
          type: string
          description: 'Existing bitlink ID to add a keyword override to. Format: domain/hash. Cannot
            be used with long_url'
        expiration_at:
          type: string
          description: Optional expiration timestamp for the bitlink (e.g., 2025-01-28T14:30:00+0000).
            Minimum expiration time is 5 minutes from now and maximum is 1 year.
        dynamic_routing:
          type: array
          description: dynamic routing rules for this bitlink.
          items:
            $ref: '#/components/schemas/DynamicRoutingRule'
      example:
        long_url: https://dev.bitly.com
        domain: bit.ly
        group_guid: Ba1bc23dE4F
        title: Bitly API Documentation
        tags:
        - bitly
        - api
    Gone:
      description: GONE
      allOf:
      - $ref: '#/components/schemas/Error'
    HasReferences:
      type: object
      properties:
        references:
          type: object
          additionalProperties:
            type: string
    InstallPreference:
      type: string
      enum:
      - no_install
      - auto_install
      - promote_install
    InternalError:
      description: INTERNAL_ERROR
      allOf:
      - $ref: '#/components/schemas/Error'
    LinkClicks:
      type: object
      properties:
        clicks:
          type: integer
        date:
          type: string
    LinkDeletionResponse:
      type: object
      properties:
        links_deleted:
          type: array
          items:
            $ref: '#/components/schemas/DeletedLink'
          example:
          - id: bit.ly/12a4b6c
          - id: chauncey.ly/documentation
    Metric:
      type: object
      properties:
        key:
          type: string
        value:
          type: integer
    MobileOS:
      type: string
      enum:
      - ios
      - android
    MonthlyLimitExceeded:
      description: MONTHLY_LIMIT_EXCEEDED
      allOf:
      - $ref: '#/components/schemas/SimplifiedError'
      example:
        message: API_USAGE_LIMIT_EXCEEDED
    NotFound:
      description: NOT_FOUND
      allOf:
      - $ref: '#/components/schemas/Error'
    OtherMetrics:
      type: object
      properties:
        other_city_clicks:
          type: integer
          x-faker: random.number
        no_city_clicks:
          type: integer
          x-faker: random.number
    QRCodeMinimal:
      type: object
      properties:
        qrcode_id:
          type: string
        group_guid:
          type: string
        title:
          type: string
        is_customized:
          description: Set to true if the QR code's customization values have been changed from their
            default setting
          type: boolean
        serialized_content:
          description: A serialized string of the QR code's content
          type: string
        qr_code_type:
          $ref: '#/components/schemas/QRCodeTypeEnum'
        long_urls:
          description: A list of destination URLs that the qr code leads to.
          type: array
          items:
            type: string
        bitlink_id:
          description: The bitlink ID associated with the qr code. Not all qr codes are associated with
            one.
          type: string
        is_gs1:
          description: Set to true if QR code has GS1 values.
          type: boolean
        created_by:
          description: User that created the code.
          type: string
        tags:
          description: A list of tags associated with QR code
          type: array
          items:
            type: string
        archived:
          type: boolean
        expiration_at:
          type: string
          description: Optional expiration timestamp for the QR code's bitlink (e.g., 2025-01-28T14:30:00+0000)
        dynamic_routing:
          type: array
          items:
            $ref: '#/components/schemas/DynamicRoutingRule'
          description: Dynamic routing rules for this QR code. Only present when at least one rule is
            configured.
        created:
          type: string
        modified:
          type: string
    QRCodeTypeEnum:
      description: The type of dynamic/static content the QR serves, e.g. Link In Bio page, micro site,
        bitlink, email, text, Wifi, etc.
      type: string
      enum:
      - bitlink
      - long_url
      - link_in_bio
      - v_card
      - wifi
      - email
      - phone
      - text
    ReferrersByDomain:
      type: object
