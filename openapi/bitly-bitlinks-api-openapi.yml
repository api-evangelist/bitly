          type: boolean
      example:
        long_url: https://dev.bitly.com
        domain: bit.ly
        group_guid: Ba1bc23dE4F
    ShortenBitlinkBody:
      type: object
      allOf:
      - $ref: '#/components/schemas/HasReferences'
      - properties:
          link:
            type: string
          id:
            type: string
          long_url:
            type: string
          archived:
            type: boolean
          created_at:
            type: string
          custom_bitlinks:
            type: array
            items:
              type: string
            description: list of previously edited backhalfs for the bitlink - these are in reverse chronological
              order, with the most recently edited backhalf first
          tags:
            type: array
            items:
              type: string
          deeplinks:
            type: array
            items:
              $ref: '#/components/schemas/DeeplinkRule'
    SimplifiedError:
      type: object
      properties:
        message:
          type: string
        description:
          type: string
        resource:
          type: string
    SortedLinks:
      type: object
