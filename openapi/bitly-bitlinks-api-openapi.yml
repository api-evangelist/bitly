        facet:
          type: string
          enum:
          - referrers_by_domains
        unit_reference:
          type: string
        referrers_by_domain:
          type: array
          items:
            $ref: '#/components/schemas/ReferrersByDomain'
    Shorten:
      type: object
      required:
      - long_url
      properties:
        long_url:
          type: string
        domain:
          type: string
          default: bit.ly
        group_guid:
          type: string
