          type: array
          items:
            $ref: '#/components/schemas/BitlinkBody'
        sorted_links:
          type: array
          items:
            $ref: '#/components/schemas/ClickLink'
    TemporarilyUnavailable:
      description: TEMPORARILY_UNAVAILABLE
      allOf:
      - $ref: '#/components/schemas/Error'
    TimeUnit:
      description: the unit of time queried for (minute, hour, day, week, month)
      type: string
      enum:
      - minute
      - hour
      - day
      - week
      - month
      default: day
    TopLinksAndQRCodes:
      description: 'Response shape for top bitlinks and decoupled QR codes in a group, ranked together
        by engagement count. `links` and `qr_codes` are independent lists (a link and a decoupled QR code
        are never the same entity); `sorted_engagements` is the unified descending-by-engagement ordering
        across both, with each entry''s id referencing either a bitlink or a QR code guid. Coupled QRCs
        are listed by their bitlink ID.

        '
      type: object
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/BitlinkBody'
        qr_codes:
          type: array
          items:
            $ref: '#/components/schemas/QRCodeMinimal'
        sorted_engagements:
          type: array
          items:
            $ref: '#/components/schemas/EngagementSubtotal'
    TotalEngagements:
      type: object
      properties:
        engagements:
          type: array
          items:
            $ref: '#/components/schemas/Engagements'
        units:
          type: integer
        unit:
          type: string
          enum:
          - minute
          - hour
          - day
          - week
          - month
        unit_reference:
          type: string
    TotalEngagementsSummary:
      type: object
      properties:
        total_engagements:
          type: integer
        engagements:
          $ref: '#/components/schemas/Engagement'
        units:
          type: integer
        unit:
          type: string
          enum:
          - minute
          - hour
          - day
          - week
          - month
        unit_reference:
          type: string
    UnprocessableEntity:
      description: UNPROCESSABLE_ENTITY
      allOf:
      - $ref: '#/components/schemas/Error'
    UpgradeRequired:
      description: UPGRADE_REQUIRED
      allOf:
      - $ref: '#/components/schemas/Error'
