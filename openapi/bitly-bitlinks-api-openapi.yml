components:
  parameters:
    Archived:
      name: archived
      description: Whether or not to include archived resources
      in: query
      schema:
        type: string
        default: 'off'
        enum:
        - 'on'
        - 'off'
        - both
      example: both
    Bitlink:
      name: bitlink
      description: A Bitlink made of the domain and hash
      in: path
      required: true
      schema:
        type: string
      example: bit.ly/12a4b6c
    CreatedAfter:
      name: created_after
      description: Timestamp as an integer unix epoch (seconds only)
      in: query
      schema:
        type: integer
      example: 1694529902
    CreatedBefore:
      name: created_before
      description: Timestamp as an integer unix epoch (seconds only)
      in: query
      schema:
        type: integer
      example: 1694529902
    Deeplinks:
      name: deeplinks
      description: Filter to only Bitlinks that contain deeplinks
      in: query
      schema:
        type: string
        default: both
        enum:
        - 'on'
        - 'off'
        - both
      example: both
    DomainDeeplinks:
      name: domain_deeplinks
      description: Filter to only Bitlinks that contain deeplinks configured with a custom domain
      in: query
      schema:
        type: string
        default: both
        enum:
        - 'on'
        - 'off'
        - both
      example: both
    EncodingLogin:
      name: encoding_login
      description: Filter by the login of the authenticated user that created the Bitlink
      in: query
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      example:
      - chauncey
    FilterCampaignGUID:
      name: campaign_guid
      description: Filter to return only links for the given campaign GUID, can be provided
      schema:
        type: string
      in: query
      example: Ca1bcd2EFGh
    FilterChannelGUID:
      name: channel_guid
      description: Filter to return only links for the given channel GUID, can be provided, overrides
        all other parameters
      schema:
        type: string
      in: query
      example: Ha1bc2DefGh
    FilterCustomBitlink:
      name: custom_bitlink
      in: query
      schema:
        type: string
        default: both
        enum:
        - 'on'
        - 'off'
        - both
      example: both
    FilterHasDynamicRouting:
      name: has_dynamic_routing
      description: filter bitlinks by presence of dynamic routing rules
      in: query
      schema:
        type: string
        default: both
        enum:
        - 'on'
        - 'off'
        - both
    FilterHasExpiration:
      name: has_expiration
      description: filter bitlinks by presence of expiration
      in: query
      schema:
        type: string
        default: both
        enum:
        - 'on'
        - 'off'
        - both
    FilterHasQRCodes:
      name: has_qr_codes
      description: a filter value if the resource has any QR codes
      in: query
      schema:
        type: string
        default: both
        enum:
        - 'on'
        - 'off'
        - both
      example: both
    FilterIsExpired:
      name: is_expired
      description: filter bitlinks by expiration status
      in: query
      schema:
        type: string
        default: both
        enum:
        - 'on'
        - 'off'
        - both
    GroupGUID:
      name: group_guid
      description: A GUID for a Bitly group
      in: path
      required: true
      schema:
        type: string
      example: Ba1bc23dE4F
    HostnamePathQuery:
      name: hostname_path_query
      description: The hostname and/or path you would like to search (case-insensitive). Subdomains included;
        query params and fragment ignored.
      in: query
      schema:
        type: string
      example: dev.bitly.com/api-reference
    LaunchpadIDs:
      name: launchpad_ids
      description: Filter by launchpad id
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      example:
      - M1234567890
    Query:
      name: query
      description: The value that you would like to search
      in: query
      schema:
        type: string
      example: api
    SearchAfter:
      name: search_after
      description: Token used to search next batch, only use response from API as input value.
      in: query
      schema:
        type: string
    Size:
      name: size
      description: The quantity of items to be be returned
      in: query
      schema:
        type: integer
        default: 50
      example: 10
    Sort:
      name: sort
      description: The type of sorting that you would like to do
      in: path
      required: true
      schema:
        type: string
        enum:
        - clicks
      example: clicks
    SortedSize:
      name: size
      description: The quantity of items to be be returned
      in: query
      schema:
        type: integer
        default: 50
        maximum: 100
      example: 10
    Tags:
      name: tags
      description: Filter by given tags
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      example:
      - bitly
      - api
    TimeUnit:
      name: unit
      description: A unit of time
      schema:
        $ref: '#/components/schemas/TimeUnit'
      required: true
      in: query
      example: month
    TimeUnitOptional:
      name: unit
      description: A unit of time
      schema:
        $ref: '#/components/schemas/TimeUnit'
      in: query
      example: month
    UnitAmount:
      name: units
      description: An integer representing the time units to query data for. pass -1 to return all units
        of time
      schema:
        type: integer
        default: -1
      required: true
      in: query
      example: 1
    UnitAmountOptional:
      name: units
      description: An integer representing the time units to query data for. pass -1 to return all units
        of time.
      schema:
        type: integer
        default: -1
      in: query
      example: 1
    UnitReferenceTimeStamp:
      name: unit_reference
      description: An ISO-8601 timestamp, indicating the most recent time for which to pull metrics. Will
        default to current time. Timestamp values should be url encoded (i.e. replace '+' with '%2B' and
        ':' with '%3A'; 2022-02-02T15:53:02+0000 becomes 2022-02-02T15%3A53%3A02%2B0000)
      schema:
        type: string
      required: false
      in: query
      example: 2006-01-02T15:04:05-0700
  schemas:
    BadRequest:
      description: BAD_REQUEST
      allOf:
      - $ref: '#/components/schemas/Error'
    BaseMetrics:
      type: object
      properties:
        unit:
          type: string
          x-faker: internet.userName
        units:
          type: integer
          x-faker:
            datatype.number:
              min: 1
              max: 100
        facet:
          type: string
          enum:
          - countries
          - cities
          - devices
          - referrers
          - referrers_by_domain
          - referring_domains
          - referring_networks
          - shorten_counts
          - destinations
        unit_reference:
          type: string
          x-faker: date.past
    BitlinkBody:
      type: object
      allOf:
      - $ref: '#/components/schemas/HasReferences'
      - $ref: '#/components/schemas/BitlinkUpdate'
    BitlinkUpdate:
      type: object
      properties:
        link:
          type: string
        id:
          type: string
        long_url:
          type: string
        title:
          type: string
        archived:
          type: boolean
        created_at:
          type: string
        created_by:
          type: string
        client_id:
          type: string
        custom_bitlinks:
          type: array
          items:
            type: string
          description: list of previously edited backhalfs for the bitlink - these are in reverse chronological
            order, with the most recently edited backhalf first
        tags:
          type: array
          items:
            type: string
        launchpad_ids:
          type: array
          items:
            type: string
        qr_code_ids:
          type: array
          items:
            type: string
          description: a list of qr code ids that are associated with this bitlink
        deeplinks:
          type: array
          items:
            $ref: '#/components/schemas/DeeplinkRule'
        is_deleted:
          type: boolean
        campaign_ids:
          type: array
          items:
            type: string
        expiration_at:
          type: string
          description: Optional expiration timestamp for the bitlink (e.g., 2025-01-28T14:30:00+0000)
        dynamic_routing:
          type: array
          items:
            $ref: '#/components/schemas/DynamicRoutingRule'
          description: Dynamic routing rules for this bitlink. Only present when at least one rule is
            configured.
    BitlinkUpdateBody:
      type: object
      properties:
        title:
          type: string
        archived:
          type: boolean
        tags:
          type: array
          items:
            type: string
        deeplinks:
          type: array
          items:
            $ref: '#/components/schemas/DeeplinkRule'
        long_url:
          type: string
        expiration_at:
          type: string
          description: Optional expiration timestamp for the bitlink (e.g., 2025-01-28T14:30:00+0000).
            Minimum expiration time is 5 minutes from now and maximum is 1 year.
        dynamic_routing:
          type: array
          items:
            $ref: '#/components/schemas/DynamicRoutingRule'
          description: Dynamic routing rules for this bitlink. Providing this field replaces all existing
            rules. Send an empty array to clear all rules.
      example:
        title: Bitly API Documentation
        archived: false
        tags:
        - bitly
        - api
        deeplinks:
        - guid: Ra1bcD2eF3h
          bitlink: bit.ly/documentation
          app_uri_path: /store?id=123456
          install_url: https://play.google.com/store/apps/details?id=com.bitly.app&hl=en_US
          app_guid: Ab1cdE2fG3h
          os: android
          install_type: promote_install
          brand_guid: Ba1bc23dE4F
    Bitlinks:
      type: object
      properties:
        links:
          type: array
          items:
            $ref: '#/components/schemas/BitlinkBody'
        pagination:
          $ref: '#/components/schemas/BitlinksPagination'
    BitlinksPagination:
      type: object
      properties:
        next:
          type: string
        search_after:
          type: string
        size:
          type: integer
    BulkUpdate:
      type: object
      properties:
        links:
          type: array
          items:
            type: string
    BulkUpdateRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - archive
          - edit_tags
          description: archive or edit_tags
        archive:
          type: boolean
        add_tags:
          type: array
          items:
            type: string
        remove_tags:
          type: array
          items:
            type: string
        links:
          type: array
          items:
            type: string
          description: this is limited to 100 bitlink ids
      example:
        action: edit_tags
        add_tags:
        - tag1
        - tag2
        links:
        - bit.ly/1234abcd
        - bit.ly/5678efgh
    CityMetric:
      type: object
      properties:
        clicks:
          type: integer
          x-faker: random.number
        city:
          type: string
          x-faker: address.city
        subregion:
          type: string
          x-faker: address.state
        region:
          type: string
          x-faker: address.state
        country:
          type: string
          x-faker: address.country
    CityMetrics:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseMetrics'
      - properties:
          metrics:
            type: array
            items:
              $ref: '#/components/schemas/CityMetric'
          other_metrics:
            $ref: '#/components/schemas/OtherMetrics'
    ClickLink:
      type: object
      properties:
        clicks:
          type: integer
        id:
          type: string
    ClickMetric:
      type: object
      properties:
        clicks:
          type: integer
          example: 123
          x-faker: random.number
        value:
          type: string
          example: bit.ly
          x-faker: internet.domainName
    ClickMetrics:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseMetrics'
      - properties:
          metrics:
            type: array
            items:
              $ref: '#/components/schemas/ClickMetric'
    Clicks:
      type: object
