                $ref: '#/components/schemas/MonthlyLimitExceeded'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
components:
  parameters:
    Archived:
      name: archived
      description: Whether or not to include archived resources
      in: query
      schema:
        type: string
        default: 'off'
        enum:
        - 'on'
        - 'off'
        - both
      example: both
    CreatedAfter:
      name: created_after
      description: Timestamp as an integer unix epoch (seconds only)
      in: query
      schema:
        type: integer
      example: 1694529902
    CreatedBefore:
      name: created_before
      description: Timestamp as an integer unix epoch (seconds only)
      in: query
      schema:
        type: integer
      example: 1694529902
    CreatingLogin:
      name: creating_login
      description: Filter by the login of the authenticated user that created the QR Code
      in: query
      schema:
        type: array
        items:
          type: string
      style: form
      explode: true
      example:
      - chauncey
    FilterHasDynamicRouting:
      name: has_dynamic_routing
      description: filter bitlinks by presence of dynamic routing rules
      in: query
      schema:
        type: string
        default: both
        enum:
        - 'on'
        - 'off'
        - both
    FilterHasExpiration:
      name: has_expiration
      description: filter bitlinks by presence of expiration
      in: query
      schema:
        type: string
        default: both
        enum:
        - 'on'
        - 'off'
        - both
    FilterHasRenderCustomizations:
      name: has_render_customizations
      description: Whether or not QRCode has any render customizations (like color or shape changes)
      in: query
      schema:
        type: string
        default: both
        enum:
        - 'on'
        - 'off'
        - both
      example: both
    FilterIsExpired:
      name: is_expired
      description: filter bitlinks by expiration status
      in: query
      schema:
        type: string
        default: both
        enum:
        - 'on'
        - 'off'
        - both
    FilterIsGS1:
      name: is_gs1
      description: a filter value if the resource is a GS1 QR code
      in: query
      schema:
        type: string
        default: both
        enum:
        - 'on'
        - 'off'
        - both
      example: both
    FilterQRCodeType:
      name: qrc_type
      in: query
      schema:
        type: array
        items:
          type: string
          enum:
          - bitlink
          - long_url
        example:
        - bitlink
        default:
        - bitlink
        - long_url
    GroupGUID:
      name: group_guid
      description: A GUID for a Bitly group
      in: path
      required: true
      schema:
        type: string
      example: Ba1bc23dE4F
    HostnamePathQuery:
      name: hostname_path_query
      description: The hostname and/or path you would like to search (case-insensitive). Subdomains included;
        query params and fragment ignored.
      in: query
      schema:
        type: string
      example: dev.bitly.com/api-reference
    QRCodeID:
      name: qrcode_id
      in: path
      description: The QR Code ID
      required: true
      schema:
        type: string
      example: Qabcde12345
    Query:
      name: query
      description: The value that you would like to search
      in: query
      schema:
        type: string
      example: api
    SearchAfterQR:
      name: search_after
      description: Token used to search next batch of qr codes, only use response from API as input value.
      in: query
      schema:
        type: string
    Size:
      name: size
      description: The quantity of items to be be returned
      in: query
      schema:
        type: integer
        default: 50
      example: 10
    Tags:
      name: tags
      description: Filter by given tags
      in: query
      style: form
      explode: true
      schema:
        type: array
        items:
          type: string
      example:
      - bitly
      - api
    TimeUnit:
      name: unit
      description: A unit of time
      schema:
        $ref: '#/components/schemas/TimeUnit'
      required: true
      in: query
      example: month
    UnitAmount:
      name: units
      description: An integer representing the time units to query data for. pass -1 to return all units
        of time
      schema:
        type: integer
        default: -1
      required: true
      in: query
      example: 1
    UnitReferenceTimeStamp:
      name: unit_reference
      description: An ISO-8601 timestamp, indicating the most recent time for which to pull metrics. Will
        default to current time. Timestamp values should be url encoded (i.e. replace '+' with '%2B' and
        ':' with '%3A'; 2022-02-02T15:53:02+0000 becomes 2022-02-02T15%3A53%3A02%2B0000)
      schema:
        type: string
      required: false
      in: query
      example: 2006-01-02T15:04:05-0700
  schemas:
    BadRequest:
      description: BAD_REQUEST
      allOf:
      - $ref: '#/components/schemas/Error'
    BaseScanMetrics:
      type: object
      properties:
        unit:
          type: string
        units:
          type: integer
        facet:
          type: string
          enum:
          - countries
          - cities
          - device_os
          - browsers
          - destinations
        unit_reference:
          type: string
    BitlinkBody:
      type: object
      allOf:
      - $ref: '#/components/schemas/HasReferences'
      - $ref: '#/components/schemas/BitlinkUpdate'
    BitlinkScans:
      type: object
      properties:
        scans:
          type: array
          items:
            $ref: '#/components/schemas/QRScans'
        units:
          type: integer
        unit:
          type: string
          enum:
          - minute
          - hour
          - day
          - week
          - month
        unit_reference:
          type: string
    BitlinkScansSummary:
      type: object
      properties:
        total_scans:
          type: integer
        units:
          type: integer
        unit:
          type: string
          enum:
          - minute
          - hour
          - day
          - week
          - month
        unit_reference:
          type: string
    BitlinkUpdate:
      type: object
      properties:
        link:
          type: string
        id:
          type: string
        long_url:
          type: string
        title:
          type: string
        archived:
          type: boolean
        created_at:
          type: string
        created_by:
          type: string
        client_id:
          type: string
        custom_bitlinks:
          type: array
          items:
            type: string
          description: list of previously edited backhalfs for the bitlink - these are in reverse chronological
            order, with the most recently edited backhalf first
        tags:
          type: array
          items:
            type: string
        launchpad_ids:
          type: array
          items:
            type: string
        qr_code_ids:
          type: array
          items:
            type: string
          description: a list of qr code ids that are associated with this bitlink
        deeplinks:
          type: array
          items:
            $ref: '#/components/schemas/DeeplinkRule'
        is_deleted:
          type: boolean
        campaign_ids:
          type: array
          items:
            type: string
        expiration_at:
          type: string
          description: Optional expiration timestamp for the bitlink (e.g., 2025-01-28T14:30:00+0000)
        dynamic_routing:
          type: array
          items:
            $ref: '#/components/schemas/DynamicRoutingRule'
          description: Dynamic routing rules for this bitlink. Only present when at least one rule is
            configured.
    CityScanMetric:
      type: object
      properties:
        scans:
          type: integer
        city:
          type: string
        subregion:
          type: string
        region:
          type: string
        country:
          type: string
    CityScanMetrics:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseScanMetrics'
      - properties:
          metrics:
            type: array
            items:
              $ref: '#/components/schemas/CityScanMetric'
          other_metrics:
            $ref: '#/components/schemas/OtherScanMetrics'
    DeeplinkRule:
      type: object
      properties:
        guid:
          type: string
        bitlink:
          type: string
        app_uri_path:
          type: string
        install_url:
          type: string
        app_guid:
          type: string
        os:
          $ref: '#/components/schemas/MobileOS'
        install_type:
          $ref: '#/components/schemas/InstallPreference'
        created:
          type: string
          description: ISO timestamp
        modified:
          type: string
          description: ISO timestamp
        brand_guid:
          type: string
    DeletedLink:
      type: object
      properties:
        id:
          type: string
    DeletedQRCode:
      type: object
      properties:
        id:
          type: string
    DynamicRoutingDeviceEnum:
      description: Device type values for use in dynamic routing rules (device_match / device_exclude)
      type: string
      enum:
      - mobile
      - tablet
      - desktop
    DynamicRoutingPlatformEnum:
      description: Platform (OS) values for use in dynamic routing rules (os_match / os_exclude)
      type: string
      enum:
      - ios
      - android
    DynamicRoutingRule:
      type: object
      description: A dynamic routing rule that redirects traffic to a different destination based on user
        attributes.
      properties:
        long_url:
          type: string
          description: The destination URL for requests matching this rule.
        country_match:
          type: array
          items:
            type: string
          description: ISO 3166-1 alpha-2 country codes that trigger this rule (e.g., ["US", "CA"]).
        country_exclude:
          type: array
          items:
            type: string
          description: ISO 3166-1 alpha-2 country codes that must NOT match for this rule to apply.
        region_match:
          type: array
          items:
            type: string
          description: ISO 3166-2 region codes that trigger this rule (e.g., ["US-CA", "CA-ON"]).
        region_exclude:
          type: array
          items:
            type: string
          description: ISO 3166-2 region codes that must NOT match for this rule to apply (e.g., ["US-CA",
            "CA-ON"]).
        device_match:
          type: array
          items:
            $ref: '#/components/schemas/DynamicRoutingDeviceEnum'
          description: Device types that trigger this rule (e.g., ["mobile", "tablet"]).
        device_exclude:
          type: array
          items:
            $ref: '#/components/schemas/DynamicRoutingDeviceEnum'
          description: Device types that must NOT match for this rule to apply.
        os_match:
          type: array
          items:
            $ref: '#/components/schemas/DynamicRoutingPlatformEnum'
          description: Operating systems that trigger this rule (e.g., ["ios", "android"]).
        os_exclude:
          type: array
          items:
            $ref: '#/components/schemas/DynamicRoutingPlatformEnum'
          description: Operating systems that must NOT match for this rule to apply.
    Error:
      type: object
      properties:
        message:
          type: string
        description:
          type: string
        resource:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      properties:
        field:
          type: string
        error_code:
          type: string
        message:
          type: string
    Forbidden:
      description: FORBIDDEN
      allOf:
      - $ref: '#/components/schemas/Error'
    GS1Metadata:
      description: Contains GS1 related metadata
      type: object
      properties:
        values:
          description: A list of GS1 application identifiers and their values
          type: array
          items:
            $ref: '#/components/schemas/GS1Value'
    GS1Value:
      type: object
      properties:
        key:
          type: string
          description: A valid GS1 application identifier, qualifier, attribute, etc.
        value:
          type: string
          description: A syntactically correct value associated with the application identifier in the
            key field.
    Gone:
      description: GONE
      allOf:
      - $ref: '#/components/schemas/Error'
    GradientColor:
      type: object
      properties:
        color:
          description: A color in hexadecimal format to be used in one of the gradient's <stop> elements
          type: string
          example: '#ff0098'
        offset:
          description: A number between 0-100 denoting the offset of the gradient color, interpreted as
            a percentage
          type: integer
          default: 0
    HasReferences:
      type: object
      properties:
        references:
          type: object
          additionalProperties:
            type: string
    InstallPreference:
      type: string
      enum:
      - no_install
      - auto_install
      - promote_install
    InternalError:
      description: INTERNAL_ERROR
      allOf:
      - $ref: '#/components/schemas/Error'
    MobileOS:
      type: string
      enum:
      - ios
      - android
    MonthlyLimitExceeded:
      description: MONTHLY_LIMIT_EXCEEDED
      allOf:
      - $ref: '#/components/schemas/SimplifiedError'
      example:
        message: API_USAGE_LIMIT_EXCEEDED
    NotFound:
      description: NOT_FOUND
      allOf:
      - $ref: '#/components/schemas/Error'
    OtherScanMetrics:
      type: object
      properties:
        other_city_scans:
          type: integer
        no_city_scans:
          type: integer
    PublicCreateQRCodeRequest:
      description: Customization and content values for a QR code created through the public API
      type: object
      required:
      - group_guid
      - destination
      properties:
        title:
          type: string
          description: The title of the QR Code
        group_guid:
          type: string
          description: Identify which group to place the QR Code.
        render_customizations:
          $ref: '#/components/schemas/QRCodeCustomizationsPublic'
        archived:
          description: A boolean representing if the QR code should be archived (hidden from the UI) upon
            creation
          type: boolean
        destination:
          $ref: '#/components/schemas/QRCodeDestination'
        gs1:
          $ref: '#/components/schemas/GS1Metadata'
        expiration_at:
          type: string
          description: Optional expiration timestamp for the QR code's bitlink (e.g., 2025-01-28T14:30:00+0000).
            Minimum expiration time is 5 minutes from now and maximum is 1 year.
        tags:
          description: A list of tags to add to the QR code
          type: array
          items:
            type: string
        dynamic_routing:
          type: array
          items:
            $ref: '#/components/schemas/DynamicRoutingRule'
          description: Optional dynamic routing rules for this decoupled QR code. Only supported for long_url
            destinations. Providing this field replaces all existing rules. Send an empty array to clear
            all rules.
        domain:
          type: string
          default: bit.ly
      example:
        title: A QR Code
        group_guid: Ba1bc23dE4F
        destination:
          bitlink_id: bit.ly/abc123
        archived: false
        tags:
        - tag1
        - tag2
        render_customizations:
          background_color: '#ffffff'
          dot_pattern_color: '#EF8000'
          dot_pattern_type: rounded
          corners:
            corner_1:
              inner_color: '#EF8000'
              outer_color: '#EF8000'
              shape: leaf
            corner_2:
              inner_color: '#EF8000'
              outer_color: '#EF8000'
              shape: leaf
            corner_3:
              inner_color: '#EF8000'
              outer_color: '#EF8000'
              shape: leaf
          gradient:
            style: linear
            angle: 45
            colors:
            - color: '#c80404'
              offset: 10
            - color: '#042f86'
              offset: 90
            exclude_corners: false
          background_gradient:
            style: radial
            colors:
            - color: '#c696ee'
              offset: 25
            - color: '#d4e1a8'
              offset: 50
          logo:
            image_guid: bitlylogo
          frame:
            id: text_bottom
            colors:
              primary: '#f55656'
              background: '#ffffff'
            text:
              primary:
                content: QR Frame
              secondary:
                content: Frame Text
          branding:
            bitly_brand: true
          spec_settings:
            error_correction: 4
    PublicCreateStaticQRCodeRequest:
      description: Request body for generating a static QR code image. Customizations such as gradient,
        background_gradient, frame, text and logo are not supported.
      type: object
      required:
      - content
      - group_guid
      properties:
        content:
          type: string
          description: The raw content to encode in the QR code (e.g. a URL).
          example: https://bitly.com
        group_guid:
          type: string
          description: The group (brand) GUID used for access control and analytics.
          example: Ba1bc23dE4F
        render_customizations:
          $ref: '#/components/schemas/QRCodeCustomizationsStaticPublic'
      example:
        content: https://bitly.com
        group_guid: Ba1bc23dE4F
        render_customizations:
          background_color: '#ffffff'
          dot_pattern_color: '#EF8000'
          dot_pattern_type: rounded
    PublicDeleteQRCodeResponse:
      description: QR Code delete response
      type: object
      properties:
        qrcodes_deleted:
          type: array
          items:
            $ref: '#/components/schemas/DeletedQRCode'
        links_deleted:
          type: array
          items:
            $ref: '#/components/schemas/DeletedLink'
    PublicQRCodeImageResponse:
      description: Wraps the image data for a QR code.
      type: object
      properties:
        qr_code_image:
          description: The stringified data for the QR code's image
          type: string
    PublicStaticQRCodeResponse:
      description: Response containing a generated static QR code image.
      type: object
      properties:
        image:
          type: string
          format: byte
          description: The image data, base64-encoded. Format is SVG or PNG depending on the requested
            format.
    PublicUpdateQRCodeRequest:
      description: Customization and content values for a QR code created through the public API
