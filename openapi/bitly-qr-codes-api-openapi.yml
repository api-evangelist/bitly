          dot_pattern_type: rounded
          corners:
            corner_1:
              inner_color: '#EF8000'
              outer_color: '#EF8000'
              shape: leaf
            corner_2:
              inner_color: '#EF8000'
              outer_color: '#EF8000'
              shape: leaf
            corner_3:
              inner_color: '#EF8000'
              outer_color: '#EF8000'
              shape: leaf
          gradient:
            style: linear
            angle: 45
            colors:
            - color: '#c80404'
              offset: 10
            - color: '#042f86'
              offset: 90
            exclude_corners: false
          background_gradient:
            style: radial
            colors:
            - color: '#c696ee'
              offset: 25
            - color: '#d4e1a8'
              offset: 50
          logo:
            image_guid: bitlylogo
          frame:
            id: text_bottom
            colors:
              primary: '#f55656'
              background: '#ffffff'
            text:
              primary:
                content: QR Frame
              secondary:
                content: Frame Text
          branding:
            bitly_brand: true
          spec_settings:
            error_correction: 4
    QRCBulkUpdate:
      type: object
      properties:
        qr_code_ids:
          type: array
          items:
            type: string
    QRCBulkUpdateRequest:
      type: object
      required:
      - action
      properties:
        action:
          type: string
          enum:
          - archive
          - edit_tags
          description: archive or edit_tags
        archive:
          type: boolean
        add_tags:
          type: array
          items:
            type: string
        remove_tags:
          type: array
          items:
            type: string
        qr_code_ids:
          type: array
          items:
            type: string
          description: this is limited to 100 QR code ids; Pages QR codes are not supported
      example:
        action: edit_tags
        add_tags:
        - tag1
        - tag2
        qr_code_ids:
        - Qo9id25UxtOcnns
        - Qb1a2c3d4e5f6g7
    QRCodeBranding:
      type: object
      properties:
        bitly_brand:
          description: A boolean that determines if the QR code should have the bitly brand in its bottom
            right corner
          type: boolean
    QRCodeCorner:
      description: Represents one corner, both inner and outer, of a QR code, with color and shape values
      type: object
      properties:
        inner_color:
          description: The inner color of a corner of the QR code in hex code format
          type: string
        outer_color:
          description: The outer color of a corner of the QR code in hex code format
          type: string
        shape:
          description: The shape one of the QR code's corners should take
          type: string
          enum:
          - standard
          - slightly_round
          - rounded
          - extra_round
          - leaf
          - leaf_inner
          - leaf_outer
          - target
          - concave
          default: standard
    QRCodeCorners:
      description: 'An object representing all three corners of the QR code. The corners corresponding
        to each property are: corner_1 = top left, corner_2 = top right, and corner_3 = bottom right'
      type: object
      properties:
        corner_1:
          $ref: '#/components/schemas/QRCodeCorner'
        corner_2:
          $ref: '#/components/schemas/QRCodeCorner'
        corner_3:
          $ref: '#/components/schemas/QRCodeCorner'
    QRCodeCustomizationsPublic:
      description: Options for customizing a QR Code's appearance
      type: object
      properties:
        background_color:
          description: The QR code's background color in hex code format with values for alpha channel
          type: string
          example: '#ff07d280'
        dot_pattern_color:
          description: The QR code's dot pattern color in hex code format
          type: string
          example: '#ff07d2'
        dot_pattern_type:
          $ref: '#/components/schemas/QRCodeDotPatternType'
        corners:
          $ref: '#/components/schemas/QRCodeCorners'
        gradient:
          $ref: '#/components/schemas/QRCodeGradient'
        background_gradient:
          $ref: '#/components/schemas/QRCodeGradient'
        logo:
          $ref: '#/components/schemas/QRCodeLogoPublic'
        frame:
          $ref: '#/components/schemas/QRCodeFrameRequest'
        text:
          $ref: '#/components/schemas/QRCodeText'
        branding:
          $ref: '#/components/schemas/QRCodeBranding'
        spec_settings:
          $ref: '#/components/schemas/QRCodeSpecSettingsPublic'
    QRCodeCustomizationsStaticPublic:
      description: Appearance options for a static QR code. gradient, background_gradient, frame, text,
        and logo are not supported.
      type: object
      properties:
        background_color:
          description: The QR code's background color in hex code format with values for alpha channel
          type: string
          example: '#ff07d280'
        dot_pattern_color:
          description: The QR code's dot pattern color in hex code format
          type: string
          example: '#ff07d2'
        dot_pattern_type:
          $ref: '#/components/schemas/QRCodeDotPatternType'
        corners:
          $ref: '#/components/schemas/QRCodeCorners'
        branding:
          $ref: '#/components/schemas/QRCodeBranding'
        spec_settings:
          $ref: '#/components/schemas/QRCodeSpecSettingsPublic'
    QRCodeDestination:
      type: object
      properties:
        bitlink_id:
          type: string
        long_url:
          type: string
        site_id:
          type: string
    QRCodeDetails:
      type: object
      properties:
        qrcode_id:
          type: string
        group_guid:
          type: string
        title:
          type: string
        gs1:
          $ref: '#/components/schemas/GS1Metadata'
        render_customizations:
          $ref: '#/components/schemas/QRCodeCustomizationsPublic'
        qr_code_type:
          $ref: '#/components/schemas/QRCodeTypeEnum'
        bitlink_id:
          description: The bitlink associated with the qr code. Not all qr codes are associated with one.
          type: string
        long_urls:
          description: A list of destination URLs that the qr code leads to.
          type: array
          items:
            type: string
        serialized_content:
          description: The serialized string of the QR code's content
          type: string
        archived:
          type: boolean
        created:
          type: string
        modified:
          type: string
        expiration_at:
          type: string
          description: Optional expiration timestamp for the QR code's bitlink (e.g., 2025-01-28T14:30:00+0000)
        tags:
          description: A list of tags associated with QR code
          type: array
          items:
            type: string
        dynamic_routing:
          type: array
          items:
            $ref: '#/components/schemas/DynamicRoutingRule'
          description: Dynamic routing rules for this QR code. Only present when at least one rule is
            configured.
    QRCodeDotPatternType:
      type: string
      enum:
      - standard
      - circle
      - block
      - blob
      - rounded
      - vertical
      - horizontal
      - triangle
      - heart
      - star
      - diamond
      default: standard
    QRCodeFrameRequest:
      type: object
      required:
      - id
      properties:
        id:
          description: The unique id of the selected frame
          $ref: '#/components/schemas/QRCodeFrameType'
        colors:
          description: An object of named colors denoting which color should go to which area of the frame
          type: object
          properties:
            primary:
              description: The primary color of the frame in hex code format
              type: string
            secondary:
              description: The secondary color of the frame in hex code format
              type: string
            background:
              description: The background color of the frame in hex code format
              type: string
        text:
          description: The text to be inserted into the QR code's frame
          type: object
          properties:
            primary:
              $ref: '#/components/schemas/Text'
            secondary:
              $ref: '#/components/schemas/Text'
    QRCodeFrameType:
      type: string
      enum:
      - none
      - border_only
      - text_bottom
      - tooltip_bottom
      - arrow
      - text_top
      - text_bottom_in_frame
      - script
      - text_top_and_bottom
      - url
      - instagram
      default: none
    QRCodeGradient:
      type: object
      properties:
        style:
          description: The style of the gradient. Can be either linear or radial.
          type: string
          enum:
          - no_gradient
          - linear
          - radial
          default: no_gradient
        angle:
          description: The angle by which the gradient will be rotated. Only applies to linear gradients.
          type: number
        colors:
          description: The list of hex colors and their offsets to be used in the gradient.
          type: array
          items:
            $ref: '#/components/schemas/GradientColor'
        exclude_corners:
          description: Ignore gradient mask on corners
          type: boolean
    QRCodeLogoPublic:
      type: object
      properties:
        image_guid:
          type: string
          description: A GUID for an image uploaded to Bitly
    QRCodeMinimal:
      type: object
      properties:
        qrcode_id:
          type: string
        group_guid:
          type: string
        title:
          type: string
        is_customized:
          description: Set to true if the QR code's customization values have been changed from their
            default setting
          type: boolean
        serialized_content:
          description: A serialized string of the QR code's content
          type: string
        qr_code_type:
          $ref: '#/components/schemas/QRCodeTypeEnum'
        long_urls:
          description: A list of destination URLs that the qr code leads to.
          type: array
          items:
            type: string
        bitlink_id:
          description: The bitlink ID associated with the qr code. Not all qr codes are associated with
            one.
          type: string
        is_gs1:
          description: Set to true if QR code has GS1 values.
          type: boolean
        created_by:
          description: User that created the code.
          type: string
        tags:
          description: A list of tags associated with QR code
          type: array
          items:
            type: string
        archived:
          type: boolean
        expiration_at:
          type: string
          description: Optional expiration timestamp for the QR code's bitlink (e.g., 2025-01-28T14:30:00+0000)
        dynamic_routing:
          type: array
          items:
            $ref: '#/components/schemas/DynamicRoutingRule'
          description: Dynamic routing rules for this QR code. Only present when at least one rule is
            configured.
        created:
          type: string
        modified:
          type: string
    QRCodeSpecSettingsPublic:
      description: The QR code's editable spec settings, which for now is just the error correction
      type: object
      properties:
        error_correction:
          description: The amount of error correction that the QR code was generated with
          type: integer
    QRCodeText:
      description: Contains the center, top, and bottom text to be used in the QR code
      type: object
      properties:
        center:
          $ref: '#/components/schemas/Text'
        top:
          $ref: '#/components/schemas/Text'
        bottom:
          $ref: '#/components/schemas/Text'
      example:
        center:
          content: Some example center text!
          color: '#ff0098'
          font: Helvetica
        top:
          content: Some example bottom text!
          color: '#00ff00'
          font: Helvetica
        bottom:
          content: Some example bottom text!
          color: '#000000'
          font: Helvetica
    QRCodeTypeEnum:
      description: The type of dynamic/static content the QR serves, e.g. Link In Bio page, micro site,
        bitlink, email, text, Wifi, etc.
      type: string
      enum:
      - bitlink
      - long_url
      - link_in_bio
      - v_card
      - wifi
      - email
      - phone
      - text
    QRCodesMinimal:
      description: QR code paginated list Response
      type: object
      properties:
        qr_codes:
          type: array
          items:
            $ref: '#/components/schemas/QRCodeMinimal'
        pagination:
          $ref: '#/components/schemas/QRPagination'
    QRPagination:
      type: object
      description: This object specifies how to query the next set of results.
      properties:
        next:
          type: string
          description: a hyperlink to the next set of results.
        search_after:
          type: string
          description: the identifier of where to begin searching for the next set of results.
          example: Qn8sfFRC2tm
        size:
          type: integer
          description: the number of results returned from this query.
          example: 50
    QRScans:
      type: object
      properties:
        scans:
          type: integer
        date:
          type: string
    RedirectQRCodeRequest:
      description: Request to redirect a QRCode
      type: object
      required:
      - long_url
      properties:
        long_url:
          type: string
          example: https://www.google.com
    ScanMetric:
      type: object
      properties:
        scans:
          type: integer
        value:
          type: string
    ScanMetrics:
      type: object
      allOf:
      - $ref: '#/components/schemas/BaseScanMetrics'
      - properties:
          metrics:
            type: array
            items:
              $ref: '#/components/schemas/ScanMetric'
    SimplifiedError:
      type: object
      properties:
        message:
          type: string
        description:
          type: string
        resource:
          type: string
    TemporarilyUnavailable:
      description: TEMPORARILY_UNAVAILABLE
      allOf:
      - $ref: '#/components/schemas/Error'
    Text:
      description: An object describing text with color
      type: object
      required:
      - content
      properties:
        content:
          description: The text to be used
          type: string
        color:
          description: The color of the text in hex code format
          type: string
          default: '#ffffff'
    TimeUnit:
      description: the unit of time queried for (minute, hour, day, week, month)
      type: string
      enum:
      - minute
      - hour
      - day
      - week
      - month
      default: day
    UnprocessableEntity:
      description: UNPROCESSABLE_ENTITY
      allOf:
      - $ref: '#/components/schemas/Error'
    UpgradeRequired:
      description: UPGRADE_REQUIRED
      allOf:
      - $ref: '#/components/schemas/Error'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
