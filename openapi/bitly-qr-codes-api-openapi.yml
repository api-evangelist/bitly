  /qr-codes/{qrcode_id}/to-bitlink:
    put:
      summary: Upgrade a QR Code to a bitlink
      description: Upgrades a stand alone (decoupled) QR Code to a coupled QR Code by associating it with
        its underlying Bitly short link. This operation consumes one encode from the organization's monthly
        Link limit. If the QR Code is already coupled, no encode is consumed.
      operationId: upgradeQRCodeToBitlink
      tags:
      - QR Codes
      parameters:
      - in: path
        name: qrcode_id
        schema:
          type: string
        required: true
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BitlinkBody'
              examples:
                Upgraded QR Code:
                  value:
                    link: https://bit.ly/abc123
                    id: bit.ly/abc123
                    long_url: https://example.com/page
                    title: My Stand Alone QR Code
                    archived: false
                    created_at: 2024-01-15T10:00:00+0000
                    created_by: jane
                    custom_bitlinks: []
                    tags: []
                    qr_code_ids:
                    - Ab1Cd2Ef3G4
        '400':
          description: BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '403':
          description: FORBIDDEN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Forbidden'
        '404':
          description: NOT_FOUND
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NotFound'
        '429':
          description: MONTHLY_LIMIT_EXCEEDED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MonthlyLimitExceeded'
        '500':
          description: INTERNAL_ERROR
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalError'
  /qr-codes/{qrcode_id}/redirect:
    patch:
      summary: Redirect a QR Code
      description: Changes the destination URL that a stand alone QR Code redirects to. This only works
        for stand alone QR Codes; a QR Code already associated with a bitlink must be updated via the
        Bitlinks API.
      operationId: redirectQRCodeDestination
      tags:
      - QR Codes
      parameters:
      - in: path
        name: qrcode_id
        schema:
          type: string
        required: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedirectQRCodeRequest'
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QRCodeMinimal'
              examples:
                Redirected QR Code:
                  value:
                    qrcode_id: Ab1Cd2Ef3G4
                    group_guid: Ba1bc23dE4F
                    title: My Stand Alone QR Code
                    is_customized: false
                    qr_code_type: long_url
                    long_urls:
                    - https://example.com/new-page
                    is_gs1: false
                    tags: []
                    archived: false
                    created: 2024-01-15T10:00:00+0000
                    updated: 2024-01-16T09:30:00+0000
        '400':
          description: BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '402':
          description: UPGRADE_REQUIRED
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpgradeRequired'
        '403':
