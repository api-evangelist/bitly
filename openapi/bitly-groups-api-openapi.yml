openapi: 3.0.0
info:
  title: Bitly Groups API
  description: The Groups surface of the Bitly v4 REST API. Extracted verbatim, operation-for-operation,
    from the authoritative OpenAPI Bitly publishes at https://dev.bitly.com/v4/v4.json — no operation,
    parameter or schema was authored by API Evangelist.
  version: 4.0.0
  termsOfService: https://bitly.com/pages/terms-of-service
  contact:
    url: https://bitly.is/API-support
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://api-ssl.bitly.com/v4
security:
- bearerAuth: []
tags:
- name: Groups
  description: 'Groups are subdivisions within organizations. Every user will be in at least one group,
    and every shortened link will be in one group. Most actions on our API will be on behalf of a group.
    For example, when you shorten a link, it will be on behalf of a user and a group.

    '
paths:
  /groups:
    get:
      summary: Retrieve Groups
      description: Returns a list of groups in the organization.
      tags:
      - Groups
      operationId: getGroups
      parameters:
      - $ref: '#/components/parameters/OrganizationGUIDFilter'
      responses:
        '200':
          description: SUCCESS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Groups'
        '400':
          description: BAD_REQUEST
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BadRequest'
        '403':
          description: FORBIDDEN
          content:
