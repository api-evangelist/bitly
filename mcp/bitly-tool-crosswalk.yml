mcp_only:
- tool: bulk_upload_validate
  reason: >-
    Bitly's OpenAPI declares a "Bulk Shorten" tag but publishes no operation under it. The signed
    upload URL flow exists only on the MCP surface and in the web app.
- tool: bulk_upload_file
  reason: >-
    Uploads to the signed URL returned by bulk_upload_validate — an S3-style PUT to a
    Bitly-issued URL, not a Bitly REST operation.

rest_only:
- operations: [createBitlink]
  reason: >-
    POST /shorten. Superseded for agent use by create_short_link, which binds the richer
    POST /bitlinks.
- operations: [addCustomBitlink, updateCustomBitlink, getClicksForCustomBitlink,
    getCustomBitlinkMetricsByDestination]
  reason: The MCP server reads custom bitlinks but cannot create, update or measure them.
- operations: [getCampaigns, getCampaign, createCampaign, updateCampaign, getChannels, getChannel,
    createChannel, updateChannel]
  reason: The entire Campaigns and Channels surface is absent from the MCP server.
- operations: [createWebhook, getWebhook, getWebhooks, updateWebhook, deleteWebhook, verifyWebhook]
  reason: >-
    The entire Webhooks surface is absent from the MCP server — an agent can read Bitly data but
    cannot subscribe to Bitly events.
- operations: [updateUser, getPlatformLimits, getPlanLimits, getOrganization,
    getOrganizationShortenCounts, getOrganizationShortenCountsByGroup]
  reason: >-
    Account administration and quota introspection are read-only or absent on MCP. Notably
    getPlatformLimits and getPlanLimits are the two operations that would let an agent check its
    own remaining quota before hitting a 429.
- operations: [updateGroup, updateGroupPreferences, getGroupTags, getGroupShortenCounts,
    getGroupFeatureUsage, getGroupHistoricalUsage, postCreateGroupExport, updateBitlinksByGroup,
    updateQRCodesByGroup, getTopLinksAndQRCodesByEngagements]
  reason: Group mutation, tagging, usage reporting and bulk group edits are REST-only.
- operations: [createStaticQRCodePublic, deleteQRCode, redirectQRCodeDestination,
    upgradeQRCodeToBitlink]
  reason: Static QR creation, QR deletion, redirect override and QR-to-Bitlink upgrade are REST-only.
- operations: [getOAuthApp]
  reason: OAuth application metadata lookup is a developer-tooling operation, not an agent action.
