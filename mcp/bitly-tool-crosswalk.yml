source: >-
  mcp/bitly-mcp.yml (tool names + parameters transcribed from
  https://dev.bitly.com/bitly-mcp/using-the-bitly-mcp-server/mcp-tools-reference/) bound against
  openapi/_original/bitly-v4-openapi.json (Bitly's own OpenAPI, fetched from
  https://dev.bitly.com/v4/v4.json)
note: >-
  Bitly's live MCP tools/list is auth-gated (HTTP 401), so tool inputSchemas could not be read
  directly. Bindings below are made on documented tool name + documented parameter names against
  real operationIds in Bitly's own OpenAPI. Where a tool's documented parameters match an
  operation's parameters one-for-one the confidence is high; where the tool is an aggregate or a
  composite over several operations it is recorded as such and the confidence is set honestly.
  Once a tool is bound, it inherits that operation's parameters and requestBody as its real
  input schema.

