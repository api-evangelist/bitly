deployment:
  mode: remote
  endpoint: https://api-ssl.bitly.com/v4/mcp
  transport: http
  auth: oauth
  verified: probed
  note: >-
    Bitly hosts the server; there is no first-party stdio package. Authentication accepts
    either a bearer access token from bitly.com/settings/api or OAuth 2.1 with Dynamic Client
    Registration (the /.well-known/oauth-authorization-server document on the same host
    advertises a registration_endpoint, code + S256 PKCE). Bitly's configuration docs tell
    stdio-only clients to proxy the SAME hosted URL with `npx mcp-remote
    https://api-ssl.bitly.com/v4/mcp` — that is a third-party proxy around a remote server,
    not a Bitly-published local server, so mode stays `remote`.

x-evidence:
  fetched: '2026-08-13'
  url: https://api-ssl.bitly.com/v4/mcp
  method: POST
  body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
  http_status: 401
  www_authenticate: >-
    Bearer as_uri="https://api-ssl.bitly.com/.well-known/oauth-protected-resource",
    error="invalid_token"
  response_body: '{"message":"UNAUTHORIZED","resource":"mcp","description":"..."}'
  interpretation: >-
    The endpoint is live and is a real MCP server — it answers the JSON-RPC POST with an
    RFC 9728 challenge naming its protected-resource document, which in turn declares
    resource https://api-ssl.bitly.com/v4/mcp. The live tool schemas are auth-gated, so the
    tools below are transcribed from Bitly's published MCP tools reference (names and
    descriptions verbatim, parameter names as documented). Full JSON Schema shapes require
    an authenticated tools/list.

configuration:
  http:
    type: http
    url: https://api-ssl.bitly.com/v4/mcp
    headers:
      Authorization: Bearer YOUR_BITLY_AUTH_TOKEN
  stdio_proxy:
    command: npx
    args:
    - mcp-remote
    - https://api-ssl.bitly.com/v4/mcp
    - --header
    - 'Authorization: Bearer ${AUTH_TOKEN}'
  token_source: https://bitly.com/settings/api

